<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SCM Dashboard</title><link rel="icon" href="favi.png"><style>:root{--navy:#071d3a;--blue:#087ee8;--line:#e4ebf3;--soft:#f6f9fc;--muted:#607086}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--soft);color:var(--navy)}header{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 5%;gap:12px}header img{width:56px;height:56px;object-fit:contain}main{max-width:1100px;margin:40px auto;padding:0 20px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;margin-bottom:20px}.row{display:flex;gap:12px;flex-wrap:wrap}input,button{padding:12px;border:1px solid var(--line);border-radius:9px;font:inherit}input{flex:1;min-width:190px}button{background:var(--blue);color:#fff;border:0;font-weight:700;cursor:pointer}.muted{color:var(--muted)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line)}#authState{margin-left:auto}.hidden{display:none}</style></head><body><header><img src="favi.png" alt=""><strong>Security Compliance Manager</strong><span id="authState" class="muted">Not signed in</span></header><main><section id="authPanel" class="panel"><h1>Company workspace</h1><p class="muted">Sign in or create an account to manage your compliance workspace.</p><div class="row"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="signIn">Sign in</button><button id="signUp">Create account</button></div></section><section id="companyPanel" class="panel hidden"><h2>Create company</h2><div class="row"><input id="companyName" placeholder="Company name"><button id="createCompany">Create workspace</button></div></section><section id="workspace" class="hidden"><div class="panel"><h1 id="companyTitle">Company</h1><p class="muted">Phase 1 workforce foundation</p></div><div class="panel"><h2>Add officer</h2><div class="row"><input id="firstName" placeholder="First name"><input id="lastName" placeholder="Last name"><input id="officerEmail" type="email" placeholder="Email"><input id="phone" placeholder="Phone"><button id="addOfficer">Add officer</button></div></div><div class="panel"><h2>Officers</h2><table><thead><tr><th>Name</th><th>Email</th><th>Phone</th></tr></thead><tbody id="officers"></tbody></table></div></section></main><script type="module" src="app.js"></script></body></html>
